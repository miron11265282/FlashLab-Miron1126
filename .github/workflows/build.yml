name: Сборка Mac, iPhone и Linux
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Скачать веб-версию игры из релиза
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName'); fi
          echo "Релиз: $TAG"
          gh release view "$TAG" --json assets -q '.assets[].name'
          mkdir -p dl && gh release download "$TAG" -D dl -p '*web*' -p '*Web*' -p '*веб*' || true
          ls -la dl
          if ls dl/*.part1 >/dev/null 2>&1; then for p in dl/*.part1; do cat "${p%.part1}".part* > "${p%.part1}"; done; fi
          Z=$(ls dl/*.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "::error::В релизе $TAG нет веб-версии. Прикрепи файл FlashLab-web.zip (или FlashLab-6.0.0-web.zip)"; exit 1; fi
          mkdir -p app/web ios/web && unzip -q "$Z" -d app/web && unzip -q "$Z" -d ios/web
          if [ ! -f app/web/index.html ]; then D=$(dirname $(find app/web -name index.html | head -1)); cp -r "$D"/. app/web/ ; cp -r "$D"/. ios/web/ ; fi
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Electron (dmg / AppImage / deb)
        working-directory: app
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: |
          npm install
          npx electron-builder --publish never
      - name: iPhone .ipa без подписи
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: ios
        run: |
          npm install
          npx cap add ios
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../app/dist/FlashLab-${TAG#v}-ios-unsigned.ipa Payload
      - name: Загрузить в релиз
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd app/dist
          for f in *.dmg *.AppImage *.deb *.ipa; do [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber || true; done
