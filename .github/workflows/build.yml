name: Сборка Mac, iPhone и Linux
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Скачать веб-версию игры из релиза
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG=$(gh release view --json tagName -q .tagName)
          gh release download "$TAG" -p '*web.zip' -O web.zip --clobber
          mkdir -p app/web ios/web
          unzip -qo web.zip -d app/web
          unzip -qo web.zip -d ios/web
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Electron (dmg для Intel и Apple / AppImage / deb)
        working-directory: app
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: |
          npm install
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          NAME='FlashLab-${version}-${os}-${arch}.${ext}'
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac --x64 --arm64 -c.artifactName="$NAME" --publish never
          else
            npx electron-builder --linux -c.artifactName="$NAME" --publish never
          fi
      - name: iPhone .ipa без подписи
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: ios
        run: |
          npm install
          npx cap add ios
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload ../app/dist && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../app/dist/FlashLab-${TAG#v}-ios-unsigned.ipa Payload
      - name: Загрузить в релиз
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd app/dist || exit 0
          shopt -s nullglob
          for f in *.dmg *.AppImage *.deb *.ipa; do
            gh release upload "$TAG" "$f" --clobber
          done
