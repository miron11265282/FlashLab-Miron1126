name: Озвучка (голоса Piper)
on:
  workflow_dispatch:
  push:
    paths: ['voice/lines.json']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установить Piper и ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q piper-tts
      - name: Озвучить фразы
        run: python tools/voice.py
      - name: Сохранить голоса в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice
          git diff --cached --quiet || git commit -m "Озвучка: новые фразы"
          git push origin HEAD:${{ github.ref_name }}
